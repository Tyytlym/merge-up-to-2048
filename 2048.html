<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>2048 · 无限合成</title>
<style>
  :root {
    --bg: #faf8ef;
    --board-bg: #bbada0;
    --cell-bg: rgba(238, 228, 218, 0.35);
    --text: #776e65;
    --panel-bg: rgba(255, 255, 255, 0.92);
    --panel-text: #776e65;
    --btn-bg: #8f7a66;
    --btn-text: #f9f6f2;
    --btn-hover: #9f8b77;
    --shadow: rgba(119, 110, 101, 0.28);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Helvetica Neue", Arial, system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 12px;
    transition: background 0.35s ease, color 0.35s ease;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

  .game {
    width: 100%;
    max-width: 480px;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .title {
    font-size: 48px;
    font-weight: 800;
    letter-spacing: -2px;
    margin: 0;
    line-height: 1;
  }

  .scores {
    display: flex;
    gap: 8px;
  }

  .score-box {
    background: var(--board-bg);
    color: #fff;
    border-radius: 8px;
    padding: 8px 14px;
    text-align: center;
    min-width: 80px;
    transition: background 0.35s ease;
  }
  .score-label {
    font-size: 11px;
    letter-spacing: 1px;
    opacity: 0.75;
    text-transform: uppercase;
  }
  .score-value {
    font-size: 22px;
    font-weight: 700;
    line-height: 1.2;
  }

  .toolbar {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  .btn {
    flex: 1;
    min-width: 80px;
    background: var(--btn-bg);
    color: var(--btn-text);
    border: none;
    border-radius: 8px;
    padding: 11px 12px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.1s ease;
    font-family: inherit;
  }
  .btn:hover { background: var(--btn-hover); }
  .btn:active { transform: scale(0.97); }

  .board-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: var(--board-bg);
    border-radius: 12px;
    padding: 10px;
    transition: background 0.35s ease;
  }

  .board {
    position: relative;
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 10px;
  }

  .cell {
    background: var(--cell-bg);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: clamp(22px, 6vw, 40px);
    color: var(--text);
    transition: background 0.2s ease, color 0.2s ease, transform 0.12s ease;
    position: relative;
    z-index: 1;
  }
  .cell.empty { color: transparent; }

  @keyframes pop {
    0% { transform: scale(0.3); opacity: 0; }
    70% { transform: scale(1.12); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes mergePulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.18); }
    100% { transform: scale(1); }
  }
  .cell.spawn { animation: pop 0.18s ease-out; }
  .cell.merged { animation: mergePulse 0.22s ease-out; }

  .game-over {
    position: absolute;
    inset: 0;
    background: rgba(238, 228, 218, 0.73);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    gap: 14px;
    z-index: 5;
  }
  .game-over.show { display: flex; }
  .game-over h2 {
    font-size: 32px;
    margin: 0;
    color: #776e65;
  }

  /* ===== 新增：开始遮罩 ===== */
  .start-overlay {
    position: absolute;
    inset: 0;
    background: var(--board-bg);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    gap: 18px;
    z-index: 6;
    padding: 24px;
    text-align: center;
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  .start-overlay.show {
    display: flex;
    animation: startFadeIn 0.35s ease-out;
  }
  @keyframes startFadeIn {
    from { opacity: 0; transform: scale(0.98); }
    to { opacity: 1; transform: scale(1); }
  }
  .start-title {
    font-size: 64px;
    font-weight: 800;
    letter-spacing: -3px;
    color: var(--text);
    line-height: 1;
  }
  .start-sub {
    font-size: 14px;
    color: var(--text);
    opacity: 0.6;
    letter-spacing: 1.5px;
    margin-top: -6px;
  }
  .start-btn {
    background: var(--btn-bg);
    color: var(--btn-text);
    border: none;
    border-radius: 32px;
    padding: 16px 48px;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 3px;
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
    animation: startPulse 2.2s ease-in-out infinite;
    margin-top: 8px;
  }
  .start-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.26);
  }
  .start-btn:active { transform: scale(0.96); }
  @keyframes startPulse {
    0%, 100% { box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18); }
    50% { box-shadow: 0 8px 32px rgba(0, 0, 0, 0.32), 0 0 0 6px rgba(255, 255, 255, 0.07); }
  }
  .start-hint {
    font-size: 12px;
    color: var(--text);
    opacity: 0.42;
    letter-spacing: 0.5px;
    margin-top: 4px;
  }

  /* ===== 模态框通用 ===== */
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 16px;
  }
  .modal.show { display: flex; }

  .modal-inner {
    background: var(--panel-bg);
    color: var(--panel-text);
    border-radius: 16px;
    width: 100%;
    max-width: 520px;
    max-height: 85vh;
    overflow-y: auto;
    padding: 22px 20px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    animation: modalIn 0.25s ease-out;
  }
  @keyframes modalIn {
    from { transform: translateY(20px) scale(0.96); opacity: 0; }
    to { transform: translateY(0) scale(1); opacity: 1; }
  }

  .modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .modal-head h3 {
    margin: 0;
    font-size: 20px;
    font-weight: 700;
  }
  .modal-close {
    background: transparent;
    border: none;
    font-size: 26px;
    line-height: 1;
    cursor: pointer;
    color: var(--panel-text);
    opacity: 0.6;
    padding: 0 4px;
    font-family: inherit;
  }
  .modal-close:hover { opacity: 1; }

  /* ===== 成就图鉴 ===== */
  .ach-progress {
    font-size: 13px;
    opacity: 0.75;
    margin-bottom: 14px;
  }
  .ach-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(94px, 1fr));
    gap: 10px;
  }
  .ach-card {
    background: rgba(0, 0, 0, 0.05);
    border: 1.5px solid transparent;
    border-radius: 12px;
    padding: 12px 8px;
    text-align: center;
    transition: all 0.25s ease;
    position: relative;
  }
  .ach-card.locked {
    opacity: 0.45;
    filter: grayscale(1);
  }
  .ach-card.unlocked {
    background: linear-gradient(135deg, rgba(237, 194, 46, 0.18), rgba(242, 177, 121, 0.15));
    border-color: rgba(237, 194, 46, 0.6);
  }
  .ach-icon {
    font-size: 26px;
    line-height: 1;
    margin-bottom: 6px;
  }
  .ach-name {
    font-size: 11px;
    font-weight: 600;
    line-height: 1.25;
  }
  .ach-desc {
    font-size: 9.5px;
    opacity: 0.6;
    margin-top: 3px;
    line-height: 1.2;
  }
  .ach-card.unlocked::after {
    content: "✓";
    position: absolute;
    top: 4px; right: 6px;
    font-size: 11px;
    font-weight: 700;
    color: #b8860b;
  }

  /* ===== 主题选择 ===== */
  .theme-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  .theme-card {
    border-radius: 12px;
    padding: 14px 12px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all 0.2s ease;
    text-align: left;
    font-family: inherit;
    background: rgba(0, 0, 0, 0.04);
    color: var(--panel-text);
  }
  .theme-card:hover { transform: translateY(-2px); }
  .theme-card.active {
    border-color: var(--btn-bg);
    box-shadow: 0 0 0 3px rgba(143, 122, 102, 0.2);
  }
  .theme-swatch {
    display: flex;
    gap: 5px;
    margin-bottom: 9px;
  }
  .theme-swatch span {
    width: 22px; height: 22px;
    border-radius: 5px;
    display: inline-block;
  }
  .theme-name {
    font-size: 13px;
    font-weight: 600;
  }

  /* ===== 分享卡片 ===== */
  .share-preview {
    width: 100%;
    border-radius: 12px;
    display: block;
    margin-bottom: 16px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
  }
  .share-actions {
    display: flex;
    gap: 10px;
  }

  /* ===== 提示 toast ===== */
  .toast-wrap {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 200;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
    width: calc(100% - 32px);
    max-width: 380px;
  }
  .toast {
    background: linear-gradient(135deg, #edc22e, #f2b179);
    color: #5c4400;
    padding: 12px 16px;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 10px;
    animation: toastIn 0.3s ease-out;
  }
  .toast .toast-icon { font-size: 20px; }
  @keyframes toastIn {
    from { transform: translateY(-16px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .toast.out {
    animation: toastOut 0.3s ease-in forwards;
  }
  @keyframes toastOut {
    to { transform: translateY(-16px); opacity: 0; }
  }

  @media (max-width: 400px) {
    .title { font-size: 38px; }
    .score-box { min-width: 68px; padding: 6px 10px; }
    .score-value { font-size: 18px; }
    .board-wrap { padding: 8px; }
    .board { gap: 8px; }
    .start-title { font-size: 52px; }
    .start-btn { padding: 14px 40px; font-size: 16px; }
  }
</style>
</head>
<body>

<div class="game">
  <div class="header">
    <h1 class="title">2048</h1>
    <div class="scores">
      <div class="score-box">
        <div class="score-label">得分</div>
        <div class="score-value" id="score">0</div>
      </div>
      <div class="score-box">
        <div class="score-label">最高</div>
        <div class="score-value" id="best">0</div>
      </div>
    </div>
  </div>

  <div class="toolbar">
    <button class="btn" id="btnNew">新游戏</button>
    <button class="btn" id="btnAch">成就</button>
    <button class="btn" id="btnTheme">主题</button>
    <button class="btn" id="btnShare">分享</button>
  </div>

  <div class="board-wrap">
    <div class="board" id="board"></div>

    <!-- 新增：开始遮罩 -->
    <div class="start-overlay" id="startOverlay">
      <div class="start-title">2048</div>
      <div class="start-sub">无限合成 · 挑战你的极限</div>
      <button class="start-btn" id="btnStart">开始游戏</button>
      <div class="start-hint">方向键 / WASD / 滑动屏幕</div>
    </div>

    <div class="game-over" id="gameOver">
      <h2>游戏结束</h2>
      <button class="btn" id="btnRetry" style="flex:none;padding:12px 28px;">再来一局</button>
    </div>
  </div>
</div>

<!-- 成就图鉴 -->
<div class="modal" id="modalAch">
  <div class="modal-inner">
    <div class="modal-head">
      <h3>成就图鉴</h3>
      <button class="modal-close" data-close="modalAch">×</button>
    </div>
    <div class="ach-progress" id="achProgress">已解锁 0 / 17</div>
    <div class="ach-grid" id="achGrid"></div>
  </div>
</div>

<!-- 主题选择 -->
<div class="modal" id="modalTheme">
  <div class="modal-inner">
    <div class="modal-head">
      <h3>配色主题</h3>
      <button class="modal-close" data-close="modalTheme">×</button>
    </div>
    <div class="theme-grid" id="themeGrid"></div>
  </div>
</div>

<!-- 分享 -->
<div class="modal" id="modalShare">
  <div class="modal-inner">
    <div class="modal-head">
      <h3>分享战绩</h3>
      <button class="modal-close" data-close="modalShare">×</button>
    </div>
    <canvas class="share-preview" id="shareCanvas" width="600" height="800"></canvas>
    <div class="share-actions">
      <button class="btn" id="btnDownload">下载图片</button>
      <button class="btn" id="btnCopyText">复制文字</button>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script>
// ==========================================
// 1. 主题系统
// ==========================================
const THEMES = {
  classic: {
    name: '经典',
    swatch: ['#faf8ef', '#bbada0', '#edc22e', '#f2b179'],
    css: {
      '--bg': '#faf8ef', '--board-bg': '#bbada0',
      '--cell-bg': 'rgba(238, 228, 218, 0.35)', '--text': '#776e65',
      '--panel-bg': 'rgba(255,255,255,0.95)', '--panel-text': '#776e65',
      '--btn-bg': '#8f7a66', '--btn-text': '#f9f6f2', '--btn-hover': '#9f8b77',
    },
    tile(v) {
      const map = {
        2:'#eee4da',4:'#ede0c8',8:'#f2b179',16:'#f59563',32:'#f67c5f',
        64:'#f65e3b',128:'#edcf72',256:'#edcc61',512:'#edc850',
        1024:'#edc53f',2048:'#edc22e'
      };
      const bg = map[v] || '#3c3a32';
      return { bg, fg: v <= 4 ? '#776e65' : '#f9f6f2' };
    }
  },
  dark: {
    name: '暗夜',
    swatch: ['#1a1d24', '#2d323c', '#6c9bff', '#a47dff'],
    css: {
      '--bg': '#12151b', '--board-bg': '#232833',
      '--cell-bg': 'rgba(255,255,255,0.05)', '--text': '#d8dee9',
      '--panel-bg': 'rgba(30,35,45,0.97)', '--panel-text': '#d8dee9',
      '--btn-bg': '#3b4252', '--btn-text': '#e5e9f0', '--btn-hover': '#4c566a',
    },
    tile(v) {
      const p = Math.log2(v);
      const hue = (p * 28) % 360;
      return { bg: `hsl(${hue}, 55%, ${28 + p * 2.5}%)`, fg: '#fff' };
    }
  },
  neon: {
    name: '霓虹',
    swatch: ['#0a0618', '#1a0f33', '#00f0ff', '#ff00e0'],
    css: {
      '--bg': '#0a0618', '--board-bg': '#1a0f33',
      '--cell-bg': 'rgba(0, 240, 255, 0.08)', '--text': '#e0d4ff',
      '--panel-bg': 'rgba(20,12,45,0.97)', '--panel-text': '#e0d4ff',
      '--btn-bg': '#6a00ff', '--btn-text': '#fff', '--btn-hover': '#8a2bff',
    },
    tile(v) {
      const p = Math.log2(v);
      const hue = (p * 36) % 360;
      return { bg: `hsl(${hue}, 95%, 58%)`, fg: '#0a0618' };
    }
  },
  sakura: {
    name: '樱花',
    swatch: ['#fff5f8', '#e8b4c8', '#ff8fb3', '#c94f7c'],
    css: {
      '--bg': '#fff5f8', '--board-bg': '#e8b4c8',
      '--cell-bg': 'rgba(255, 255, 255, 0.45)', '--text': '#8b3a5c',
      '--panel-bg': 'rgba(255,245,248,0.97)', '--panel-text': '#8b3a5c',
      '--btn-bg': '#c94f7c', '--btn-text': '#fff', '--btn-hover': '#e06a92',
    },
    tile(v) {
      const p = Math.log2(v);
      const hue = 335 + (p * 4) % 20;
      const light = Math.max(35, 88 - p * 4);
      return { bg: `hsl(${hue}, 75%, ${light}%)`, fg: p <= 2 ? '#8b3a5c' : '#fff' };
    }
  }
};

let currentTheme = localStorage.getItem('2048-theme') || 'classic';

function applyTheme(name) {
  if (!THEMES[name]) return;
  currentTheme = name;
  const theme = THEMES[name];
  for (const [k, v] of Object.entries(theme.css)) {
    document.documentElement.style.setProperty(k, v);
  }
  localStorage.setItem('2048-theme', name);
  render();
  renderThemeGrid();
}

// ==========================================
// 2. 成就定义（17 个）
// ==========================================
const ACHIEVEMENTS = [
  { id: 'first_merge', icon: '✨', name: '初次合并',  desc: '完成第一次合并' },
  { id: 'tile_4',      icon: '🌱', name: '小试牛刀',  desc: '合出 4' },
  { id: 'tile_8',      icon: '🌿', name: '渐入佳境',  desc: '合出 8' },
  { id: 'tile_16',     icon: '🍀', name: '十六进制',  desc: '合出 16' },
  { id: 'tile_32',     icon: '🔢', name: '三十二变',  desc: '合出 32' },
  { id: 'tile_64',     icon: '🎯', name: '六十四格',  desc: '合出 64' },
  { id: 'tile_128',    icon: '💠', name: '百二十八',  desc: '合出 128' },
  { id: 'tile_256',    icon: '🔷', name: '二百五十六',desc: '合出 256' },
  { id: 'tile_512',    icon: '💎', name: '五百一十二',desc: '合出 512' },
  { id: 'tile_1024',   icon: '🏆', name: '千里之行',  desc: '合出 1024' },
  { id: 'tile_2048',   icon: '👑', name: '登顶时刻',  desc: '合出 2048' },
  { id: 'tile_4096',   icon: '🚀', name: '超越极限',  desc: '合出 4096' },
  { id: 'tile_8192',   icon: '🌟', name: '万中无一',  desc: '合出 8192' },
  { id: 'score_1000',  icon: '🔥', name: '千分达成',  desc: '单局得分 1000' },
  { id: 'score_5000',  icon: '⚡', name: '五千分',    desc: '单局得分 5000' },
  { id: 'score_10000', icon: '💫', name: '万分选手',  desc: '单局得分 10000' },
  { id: 'steps_500',   icon: '👣', name: '步步为营',  desc: '步数达到 500' },
];

let unlocked = new Set(JSON.parse(localStorage.getItem('2048-ach') || '[]'));

function unlock(id) {
  if (unlocked.has(id)) return;
  unlocked.add(id);
  localStorage.setItem('2048-ach', JSON.stringify([...unlocked]));
  const a = ACHIEVEMENTS.find(x => x.id === id);
  if (a) showToast(a);
  renderAchievements();
}

function showToast(a) {
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span class="toast-icon">${a.icon}</span><span>成就解锁：${a.name}</span>`;
  wrap.appendChild(el);
  setTimeout(() => {
    el.classList.add('out');
    setTimeout(() => el.remove(), 300);
  }, 2200);
}

function showTip(text) {
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span class="toast-icon">💡</span><span>${text}</span>`;
  wrap.appendChild(el);
  setTimeout(() => {
    el.classList.add('out');
    setTimeout(() => el.remove(), 300);
  }, 1800);
}

// ==========================================
// 3. 游戏核心
// ==========================================
const SIZE = 4;
// 初始全 0，保证 applyTheme() 触发的 render() 能正常画出空棋盘
let grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
let score = 0;
let steps = 0;
let best = parseInt(localStorage.getItem('2048-best') || '0', 10);
let gameOver = false;
let started = false;            // 新增：是否已开局
let newCells = new Set();
let mergedCells = new Set();

const boardEl = document.getElementById('board');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const gameOverEl = document.getElementById('gameOver');
const startOverlay = document.getElementById('startOverlay');

function initGrid() {
  started = true;
  startOverlay.classList.remove('show');   // 开局即隐藏开始遮罩
  grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
  score = 0;
  steps = 0;
  gameOver = false;
  newCells.clear();
  mergedCells.clear();
  addRandomTile();
  addRandomTile();
  updateScore();
  render();
  gameOverEl.classList.remove('show');
}

function addRandomTile() {
  const empty = [];
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++)
      if (grid[r][c] === 0) empty.push([r, c]);
  if (!empty.length) return;
  const [r, c] = empty[Math.floor(Math.random() * empty.length)];
  grid[r][c] = Math.random() < 0.9 ? 2 : 4;
  newCells.add(`${r},${c}`);
}

function updateScore() {
  scoreEl.textContent = score;
  if (score > best) {
    best = score;
    localStorage.setItem('2048-best', best);
  }
  bestEl.textContent = best;
}

function render() {
  boardEl.innerHTML = '';
  const theme = THEMES[currentTheme];
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const v = grid[r][c];
      const cell = document.createElement('div');
      cell.className = 'cell' + (v === 0 ? ' empty' : '');
      if (v > 0) {
        const style = theme.tile(v);
        cell.textContent = v;
        cell.style.background = style.bg;
        cell.style.color = style.fg;
        const key = `${r},${c}`;
        if (newCells.has(key)) cell.classList.add('spawn');
        else if (mergedCells.has(key)) cell.classList.add('merged');
      }
      boardEl.appendChild(cell);
    }
  }
  newCells.clear();
  mergedCells.clear();
}

function slideLine(line) {
  const arr = line.filter(v => v !== 0);
  const result = [];
  let gained = 0;
  let merged = 0;
  for (let i = 0; i < arr.length; i++) {
    if (i + 1 < arr.length && arr[i] === arr[i + 1]) {
      const m = arr[i] * 2;
      result.push(m);
      gained += m;
      merged++;
      i++;
    } else {
      result.push(arr[i]);
    }
  }
  while (result.length < SIZE) result.push(0);
  return { line: result, gained, merged };
}

function move(dir) {
  if (gameOver || !started) return;   // 未开局不允许移动
  const old = grid.map(row => [...row]);
  let gained = 0;
  let mergedCount = 0;

  const rotate = (g, times) => {
    let res = g;
    for (let t = 0; t < times; t++) {
      const n = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
      for (let r = 0; r < SIZE; r++)
        for (let c = 0; c < SIZE; c++)
          n[c][SIZE - 1 - r] = res[r][c];
      res = n;
    }
    return res;
  };

  const rotations = { left: 0, up: 3, right: 2, down: 1 };
  let g = rotate(grid, rotations[dir]);

  for (let r = 0; r < SIZE; r++) {
    const { line, gained: gg, merged: mm } = slideLine(g[r]);
    g[r] = line;
    gained += gg;
    mergedCount += mm;
  }

  g = rotate(g, (4 - rotations[dir]) % 4);
  grid = g;

  const changed = JSON.stringify(old) !== JSON.stringify(grid);
  if (!changed) return;

  steps++;
  score += gained;
  updateScore();

  mergedCells.clear();
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++)
      if (old[r][c] !== grid[r][c] && grid[r][c] !== 0 && grid[r][c] === old[r][c] * 2)
        mergedCells.add(`${r},${c}`);

  addRandomTile();
  render();

  if (mergedCount > 0) playMergeSound(gained);
  else playMoveSound();

  checkAchievements();
  checkGameOver();
}

function checkGameOver() {
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++) {
      if (grid[r][c] === 0) return;
      if (c + 1 < SIZE && grid[r][c] === grid[r][c + 1]) return;
      if (r + 1 < SIZE && grid[r][c] === grid[r + 1][c]) return;
    }
  gameOver = true;
  gameOverEl.classList.add('show');
  if (score > 0) unlock('first_merge');
}

function checkAchievements() {
  let maxTile = 0;
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++)
      if (grid[r][c] > maxTile) maxTile = grid[r][c];

  if (steps > 0) unlock('first_merge');
  for (const t of [4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192]) {
    if (maxTile >= t) unlock('tile_' + t);
  }
  if (score >= 1000) unlock('score_1000');
  if (score >= 5000) unlock('score_5000');
  if (score >= 10000) unlock('score_10000');
  if (steps >= 500) unlock('steps_500');
}

// ==========================================
// 4. 音效
// ==========================================
let audioCtx;
function playMergeSound(gained) {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const freq = Math.min(180 + Math.log2(gained) * 60, 1200);
  osc.type = 'sine';
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(freq * 1.5, audioCtx.currentTime + 0.08);
  gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.18);
}

function playMoveSound() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(140, audioCtx.currentTime);
  gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.06);
}

// ==========================================
// 5. 输入
// ==========================================
window.addEventListener('keydown', (e) => {
  const map = {
    ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down',
    a: 'left', d: 'right', w: 'up', s: 'down',
    A: 'left', D: 'right', W: 'up', S: 'down',
  };
  if (map[e.key]) {
    e.preventDefault();
    move(map[e.key]);
  }
});

let touchStart = null;
window.addEventListener('touchstart', (e) => {
  if (e.target.closest('.modal')) return;
  const t = e.touches[0];
  touchStart = { x: t.clientX, y: t.clientY };
}, { passive: true });

window.addEventListener('touchend', (e) => {
  if (!touchStart) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStart.x;
  const dy = t.clientY - touchStart.y;
  const absX = Math.abs(dx), absY = Math.abs(dy);
  if (Math.max(absX, absY) < 24) { touchStart = null; return; }
  if (absX > absY) move(dx > 0 ? 'right' : 'left');
  else move(dy > 0 ? 'down' : 'up');
  touchStart = null;
}, { passive: true });

// ==========================================
// 6. 成就图鉴渲染
// ==========================================
function renderAchievements() {
  const grid = document.getElementById('achGrid');
  grid.innerHTML = '';
  for (const a of ACHIEVEMENTS) {
    const card = document.createElement('div');
    const isUnlocked = unlocked.has(a.id);
    card.className = 'ach-card ' + (isUnlocked ? 'unlocked' : 'locked');
    card.innerHTML = `
      <div class="ach-icon">${isUnlocked ? a.icon : '🔒'}</div>
      <div class="ach-name">${a.name}</div>
      <div class="ach-desc">${a.desc}</div>
    `;
    grid.appendChild(card);
  }
  document.getElementById('achProgress').textContent =
    `已解锁 ${unlocked.size} / ${ACHIEVEMENTS.length}`;
}

// ==========================================
// 7. 主题网格渲染
// ==========================================
function renderThemeGrid() {
  const grid = document.getElementById('themeGrid');
  grid.innerHTML = '';
  for (const [key, theme] of Object.entries(THEMES)) {
    const card = document.createElement('button');
    card.className = 'theme-card' + (key === currentTheme ? ' active' : '');
    card.innerHTML = `
      <div class="theme-swatch">
        ${theme.swatch.map(c => `<span style="background:${c}"></span>`).join('')}
      </div>
      <div class="theme-name">${theme.name}</div>
    `;
    card.addEventListener('click', () => {
      applyTheme(key);
      closeModal('modalTheme');
    });
    grid.appendChild(card);
  }
}

// ==========================================
// 8. 分享卡片生成
// ==========================================
function generateShareCard() {
  const canvas = document.getElementById('shareCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const theme = THEMES[currentTheme];
  const bg = theme.css['--bg'];
  const boardBg = theme.css['--board-bg'];
  const textColor = theme.css['--text'];
  const btnBg = theme.css['--btn-bg'];

  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  const grad = ctx.createLinearGradient(0, 0, W, 0);
  grad.addColorStop(0, btnBg);
  grad.addColorStop(1, theme.swatch[3]);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, 6);

  ctx.fillStyle = textColor;
  ctx.font = 'bold 64px "Helvetica Neue", Arial, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('2048', 48, 110);

  ctx.font = '18px "Helvetica Neue", Arial, sans-serif';
  ctx.globalAlpha = 0.6;
  ctx.fillText('无限合成 · 战绩分享', 48, 145);
  ctx.globalAlpha = 1;

  let maxTile = 0;
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++)
      if (grid[r][c] > maxTile) maxTile = grid[r][c];

  const stats = [
    { label: '本局得分', value: score },
    { label: '历史最高', value: best },
    { label: '最大方块', value: maxTile || '—' },
    { label: '移动步数', value: steps },
    { label: '已解锁成就', value: `${unlocked.size} / ${ACHIEVEMENTS.length}` },
  ];

  const startY = 210;
  const rowH = 62;
  for (let i = 0; i < stats.length; i++) {
    const y = startY + i * rowH;
    ctx.fillStyle = 'rgba(0,0,0,0.04)';
    roundRect(ctx, 48, y, W - 96, rowH - 10, 10);
    ctx.fill();

    ctx.fillStyle = textColor;
    ctx.globalAlpha = 0.65;
    ctx.font = '16px "Helvetica Neue", Arial, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(stats[i].label, 68, y + 32);

    ctx.globalAlpha = 1;
    ctx.font = 'bold 26px "Helvetica Neue", Arial, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(String(stats[i].value), W - 68, y + 34);
  }

  const boardY = startY + stats.length * rowH + 20;
  const boardSize = W - 96;
  const cellSize = (boardSize - 30) / 4;
  ctx.fillStyle = boardBg;
  roundRect(ctx, 48, boardY, boardSize, boardSize, 14);
  ctx.fill();

  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const v = grid[r][c];
      const x = 48 + 10 + c * (cellSize + 3.33);
      const y = boardY + 10 + r * (cellSize + 3.33);
      const style = theme.tile(v || 2);
      ctx.fillStyle = v ? style.bg : theme.css['--cell-bg'];
      roundRect(ctx, x, y, cellSize - 3, cellSize - 3, 8);
      ctx.fill();
      if (v) {
        ctx.fillStyle = style.fg;
        ctx.font = `bold ${Math.min(cellSize * 0.38, 28)}px "Helvetica Neue", Arial, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(String(v), x + (cellSize - 3) / 2, y + (cellSize - 3) / 2 + 1);
      }
    }
  }
  ctx.textBaseline = 'alphabetic';

  ctx.fillStyle = textColor;
  ctx.globalAlpha = 0.45;
  ctx.font = '14px "Helvetica Neue", Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Tyytlym · merge-up-to-2048', W / 2, H - 36);
  ctx.globalAlpha = 1;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ==========================================
// 9. 模态框控制
// ==========================================
function openModal(id) {
  document.getElementById(id).classList.add('show');
}
function closeModal(id) {
  document.getElementById(id).classList.remove('show');
}

document.querySelectorAll('[data-close]').forEach(btn => {
  btn.addEventListener('click', () => closeModal(btn.dataset.close));
});
document.querySelectorAll('.modal').forEach(m => {
  m.addEventListener('click', (e) => {
    if (e.target === m) closeModal(m.id);
  });
});

// ==========================================
// 10. 按钮绑定
// ==========================================
document.getElementById('btnStart').addEventListener('click', () => {
  initGrid();
});

document.getElementById('btnNew').addEventListener('click', () => {
  initGrid();
});
document.getElementById('btnRetry').addEventListener('click', () => {
  initGrid();
});
document.getElementById('btnAch').addEventListener('click', () => {
  renderAchievements();
  openModal('modalAch');
});
document.getElementById('btnTheme').addEventListener('click', () => {
  renderThemeGrid();
  openModal('modalTheme');
});
document.getElementById('btnShare').addEventListener('click', () => {
  if (!started) {
    showTip('先开始一局吧～');
    return;
  }
  generateShareCard();
  openModal('modalShare');
});
document.getElementById('btnDownload').addEventListener('click', () => {
  const canvas = document.getElementById('shareCanvas');
  const a = document.createElement('a');
  a.download = `2048-战绩-${score}分.png`;
  a.href = canvas.toDataURL('image/png');
  a.click();
});
document.getElementById('btnCopyText').addEventListener('click', () => {
  let maxTile = 0;
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++)
      if (grid[r][c] > maxTile) maxTile = grid[r][c];
  const txt = `我在 2048 无限合成中拿到 ${score} 分，最大方块 ${maxTile || '—'}，走了 ${steps} 步，解锁 ${unlocked.size}/${ACHIEVEMENTS.length} 个成就！`;
  navigator.clipboard.writeText(txt).then(() => {
    const btn = document.getElementById('btnCopyText');
    const old = btn.textContent;
    btn.textContent = '已复制 ✓';
    setTimeout(() => btn.textContent = old, 1500);
  }).catch(() => alert(txt));
});

// ==========================================
// 11. 启动
// ==========================================
applyTheme(currentTheme);      // 触发 render()，用全 0 的 grid 画出空棋盘
renderAchievements();
renderThemeGrid();
startOverlay.classList.add('show');   // 显示开始遮罩，等待用户点击
</script>
